name: Gym App CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-apis:
    name: Run Postman API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Paystack QA Tests
        run: newman run tests/paystack_collection.json

  build-containers:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-apis # This tells the pipeline to wait for the tests to pass first!

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Frontend Container
        run: docker build -t gym-app-frontend ./frontend

      - name: Build Backend Container
        run: docker build -t gym-app-backend ./backend

      - name: Verify Images
        run: docker images